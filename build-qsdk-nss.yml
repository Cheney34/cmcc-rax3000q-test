# 轨道 B：ImmortalWrt 21.02 + QSDK 5.4 —— 完整高通 NSS（NSS-DP / NSS-DRV / NSS 固件）
#
# 目的：NAT 与 Wi-Fi 全部卸载到 NSS NPU。代价是内核 5.4、包体系是 opkg/.ipk 且源为
# ImmortalWrt 21.02（非官方）。
# 骨架与依赖修补参考 kkstone/Actions-OpenWrt-RAX3000Q（MIT），此处重写为自持版本。
name: Build ImmortalWrt QSDK NSS (轨道B)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 调试（debug）'
        required: false
        default: 'false'
        type: boolean
      reuse_kkstone_config:
        description: '强制改用 kkstone 的 .config（自动探测失败时的兜底）'
        required: false
        default: 'false'
        type: boolean

env:
  REPO_URL: https://github.com/kkstone/immortalwrt-ipq50xx
  REPO_BRANCH: openwrt-21.02
  CONFIG_SEED: qsdk/config.seed
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@main

      - name: 准备编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          df -h
          echo "清理 GitHub 镜像里的无用大件"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup /usr/local/graalvm || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5 libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir && sudo chown "$USER:$GROUPS" /workdir
          df -h

      - name: 克隆源码（ImmortalWrt ipq50xx / openwrt-21.02）
        working-directory: /workdir
        run: |
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: ccache 加速
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: 'immortalwrt21-ipq50xx-qsdk'
          prefix: ${{ github.workspace }}/openwrt

      - name: 更新 & 安装 feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 修补 golang / node（21.02 自带版本太老，很多包编不过）
        working-directory: /workdir/openwrt
        run: |
          rm -rf feeds/packages/lang/golang
          git clone --depth=1 https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang || true
          rm -rf feeds/packages/lang/node
          git clone --depth=1 https://github.com/sbwml/feeds_packages_lang_node-prebuilt \
            -b packages-24.10 feeds/packages/lang/node || true

      - name: 生成 .config —— 自动探测 target / subtarget / 设备符号 + 叠加种子配置
        id: cfg
        working-directory: /workdir/openwrt
        run: |
          set -e
          echo "== 该 target 支持的设备符号（临时探测）=="
          SUBTARGET=""
          DEV_SYM=""
          for st in arm aarch64; do
            printf 'CONFIG_TARGET_ipq50xx=y\nCONFIG_TARGET_ipq50xx_%s=y\n' "$st" > .config
            make defconfig >/dev/null 2>&1 || true
            echo "--- subtarget=$st ---"
            grep -oE "CONFIG_TARGET_ipq50xx_${st}_DEVICE_[A-Za-z0-9_]+=y" .config | sort || true
            hit=$(grep -oE "CONFIG_TARGET_ipq50xx_${st}_DEVICE_[A-Za-z0-9_]+=y" .config \
                  | grep -i -e rax -e cmcc | head -n1 || true)
            if [ -n "$hit" ]; then
              SUBTARGET="$st"
              DEV_SYM="${hit%=y}"
              break
            fi
          done

          if [ -z "$SUBTARGET" ]; then
            echo "::warning:: 自动探测没找到 RAX3000Q 设备符号，改用 kkstone 的 .config 兜底"
            git clone --depth=1 https://github.com/kkstone/Actions-OpenWrt-RAX3000Q /tmp/kk
            cp /tmp/kk/.config .config
            FORCE_KK=1
          else
            echo "探测结果: SUBTARGET=$SUBTARGET DEV_SYM=$DEV_SYM"
            {
              echo "CONFIG_TARGET_ipq50xx=y"
              echo "CONFIG_TARGET_ipq50xx_${SUBTARGET}=y"
              echo "CONFIG_TARGET_ipq50xx_${SUBTARGET}_DEVICE_${DEV_SYM##*_DEVICE_}=y"
            } > .config
            if [ -f "$GITHUB_WORKSPACE/$CONFIG_SEED" ]; then
              cat "$GITHUB_WORKSPACE/$CONFIG_SEED" >> .config
            fi
          fi

          make defconfig >/dev/null 2>&1

          echo "== 最终 .config 里的设备选择 =="
          grep -E '^CONFIG_TARGET_(ipq50xx|.*DEVICE.*)=y' .config | tee config-targets.txt

          # NSS 三件套必须在内
          for p in kmod-qca-nss-dp kmod-qca-nss-drv qca-nss-fw-ipq50xx-retail; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "::error:: $p 没有进配置，target 默认包可能被覆盖"
              exit 1
            fi
          done
          echo "== NSS 三件套已确认 =="

          # 报告「请求了但没选上」的包（包名写错 / 该 feed 里不存在）——不中断编译，只告警
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_SEED" ]; then
            MISSING=""
            for pkg in $(grep -oE '^CONFIG_PACKAGE_[^=]+=y' "$GITHUB_WORKSPACE/$CONFIG_SEED" \
                         | sed 's/^CONFIG_PACKAGE_//; s/=y$//'); do
              grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || MISSING="$MISSING $pkg"
            done
            if [ -n "$MISSING" ]; then
              echo "::warning::以下包名未被接受（可能名字不对或该 feed 里不存在）:$MISSING"
              printf 'MISSING PACKAGES:%s\n' "$MISSING" | tee missing-packages.txt
            else
              echo "::notice::所有请求的包都已成功选上"
            fi
          fi

      - name: 叠加自定义 files/（公共 + 轨道B 专属）
        run: |
          set -e
          mkdir -p /workdir/openwrt/files
          cp -a "$GITHUB_WORKSPACE/common/files/." /workdir/openwrt/files/ 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/qsdk/files/." /workdir/openwrt/files/ 2>/dev/null || true
          find /workdir/openwrt/files -type f -name '*.sh' -exec chmod +x {} \; || true
          chmod +x /workdir/openwrt/files/usr/sbin/* 2>/dev/null || true
          # /etc/uci-defaults/* 没有 .sh 后缀，但必须可执行，否则首次启动不会执行
          chmod +x /workdir/openwrt/files/etc/uci-defaults/* 2>/dev/null || true
          echo "== uci-defaults 权限 =="
          ls -l /workdir/openwrt/files/etc/uci-defaults/ 2>/dev/null || true
          echo "== files/ overlay =="
          find /workdir/openwrt/files -type f | sort

      - name: 预置 QSDK 内核/backports 源码包（上游下载地址已失效）
        working-directory: /workdir/openwrt
        run: |
          mkdir -p dl
          wget -q --show-progress -O dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz \
            "https://www.dropbox.com/scl/fi/9ts30p2csnlb9imaf8k68/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz?rlkey=sntbyfjgg86gu2uoocgb9ggp1&st=7w81hl56&dl=1" \
            || echo "::warning:: backports 预置失败，后面 make download 可能会失败"
          wget -q --show-progress -O dl/linux-5.4-qsdk-11.5.0.5.tar.xz \
            "https://www.dropbox.com/scl/fi/gu7ge6jmefn72ttuop1zs/linux-5.4-qsdk-11.5.0.5.tar.xz?rlkey=tdpq0ye35x290frbh7i8uqrm8&st=jjvegqrr&dl=1" \
            || echo "::warning:: QSDK 内核预置失败，后面 make download 可能会失败"
          ls -l dl/ || true
          # 下载失败会留下 HTML 错误页，删掉小于 1KB 的垃圾
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: 下载依赖
        working-directory: /workdir/openwrt
        run: |
          make download -j8 || make download -j1 V=s

      - name: SSH 调试（仅当手动勾选）
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: owenthereal/action-upterm@v1

      - name: 编译
        id: compile
        working-directory: /workdir/openwrt
        run: |
          echo "$(nproc) 线程编译"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 收集产物
        if: steps.compile.outputs.status == 'success'
        run: |
          set -x
          ls -lh /workdir/openwrt/bin/targets/*/*/
          mkdir -p out
          cp -a /workdir/openwrt/bin/targets/*/*/*.bin out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/*/*/*.ubi out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/*/*/*.itb out/ 2>/dev/null || true
          cp -a /workdir/openwrt/.config out/config.final.txt || true
          cp -a /workdir/openwrt/DEVICE_NAME out/ 2>/dev/null || true
          ls -lh out/

      - name: 上传编译产物
        uses: actions/upload-artifact@main
        with:
          name: openwrt-qsdk-nss-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: 失败时也保存 .config 与日志便于排查
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: qsdk-debug-${{ github.run_number }}
          path: |
            /workdir/openwrt/.config
            /workdir/openwrt/logs/
          if-no-files-found: ignore

      - name: 发 Release（仅 main 分支的手动触发）
        if: steps.compile.outputs.status == 'success' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: qsdk-nss-${{ github.run_number }}
          name: 轨道B ImmortalWrt QSDK NSS #${{ github.run_number }}
          body: |
            ImmortalWrt 21.02 (QSDK 5.4) for CMCC RAX3000Q / RAX3000QY (ipq50xx)
            - NSS：kmod-qca-nss-dp + kmod-qca-nss-drv + qca-nss-fw-ipq50xx-retail（target 默认）
            - IPv6 已开启，portal 认证内置
            - 刷机说明见仓库 docs/刷机教程.md
          files: out/*
          fail_on_unmatched_files: false
