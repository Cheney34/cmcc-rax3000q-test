# 轨道 A：OpenWrt 官方 main（= snapshot / r37117 体系）—— 官方包兼容
#
# 核心策略（保住「官方包能装」）：
#   1. 源码用官方 openwrt/openwrt，默认取 main 当前 HEAD（跟随官方 snapshot，避免内核哈希过期）
#   2. 只加「用户态包」（LuCI / portal / IPv6 工具 / 无线固件），**不选任何 kmod**
#      —— 一旦内核配置变了，官方源里的 kmod-* 就装不上（vermagic 不匹配）
#   3. 构建后把本地产物的内核 vermagic 与官方 profiles.json 里的值对比，不一致就明确告警
#
# 产物：openwrt-qualcommax-ipq50xx-cmcc_rax3000q-squashfs-factory.ubi（U-Boot 网页可刷）
name: Build OpenWrt official main (轨道A)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要编译的 openwrt/openwrt 提交或分支（留空=main 最新）'
        required: false
        default: ''
        type: string
      enable_wifi:
        description: '是否在 DTS 里重新打开 Wi-Fi（上游因 256MB RAM 的 OOM 风险默认关闭）'
        required: false
        default: 'true'
        type: boolean
      ssh:
        description: '是否开启 SSH 调试（debug）'
        required: false
        default: 'false'
        type: boolean

env:
  REPO_URL: https://github.com/openwrt/openwrt
  CONFIG_SEED: official/config.seed
  TARGET_PATH: qualcommax/ipq50xx
  DEVICE_SYM: qualcommax_ipq50xx_DEVICE_cmcc_rax3000q
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@main

      - name: 准备编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/graalvm || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5 libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir && sudo chown "$USER:$GROUPS" /workdir
          df -h

      - name: 克隆官方源码
        working-directory: /workdir
        run: |
          set -x
          git clone --filter=blob:none "$REPO_URL" openwrt
          cd openwrt
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            git checkout "${{ github.event.inputs.ref }}"
          fi
          git log -1 --format='HEAD = %H  (%ci)' | tee "$GITHUB_WORKSPACE/openwrt-head.txt"
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: 源码补丁：重新打开 Wi-Fi（可选，见 official/scripts/enable-wifi.py）
        if: ${{ github.event.inputs.enable_wifi != 'false' }}
        working-directory: /workdir/openwrt
        run: |
          set -x
          # 补丁失败**不让构建失败**：最坏情况就是「官方默认无 Wi-Fi」，其它功能照常
          if ! python3 "$GITHUB_WORKSPACE/official/scripts/enable-wifi.py" /workdir/openwrt \
                 2>&1 | tee "$GITHUB_WORKSPACE/wifi-patch.txt"; then
            echo "::warning::Wi-Fi 补丁脚本失败（上游可能改了 DTS 路径/结构）—— 按官方默认（无 Wi-Fi）继续构建，详见 wifi-patch.txt"
          fi
          echo "---- 补丁后 DTS 里的 okay 节点 ----"
          grep -rn 'status = "okay"' target/linux/qualcommax/dts/ipq5018-rax3000q.dts | tail -n 10 || true
          echo "---- git diff ----"
          git --no-pager diff --stat || true
          git --no-pager diff | tail -n 60 || true

      - name: ccache 加速
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: 'official-ipq50xx-rax3000q'
          prefix: ${{ github.workspace }}/openwrt

      - name: 更新 & 安装 feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config（target/设备 + 种子包列表）并校验
        id: cfg
        working-directory: /workdir/openwrt
        run: |
          set -e
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y
          EOF
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_SEED" ]; then
            cat "$GITHUB_WORKSPACE/$CONFIG_SEED" >> .config
          fi

          # 关键：禁止把 kmod 编进固件（会让 vermagic 与官方不一致）
          if grep -qE '^CONFIG_PACKAGE_kmod-[^=]*=y' "$GITHUB_WORKSPACE/$CONFIG_SEED" 2>/dev/null; then
            echo "::error::$CONFIG_SEED 里出现了 CONFIG_PACKAGE_kmod-*=y（除目标默认外不允许），会让官方 kmod 装不上"
            grep -nE '^CONFIG_PACKAGE_kmod-[^=]*=y' "$GITHUB_WORKSPACE/$CONFIG_SEED"
            exit 1
          fi

          # ---- 自动探测无线固件与板级 BDF（上游改名/新增时也不会编错）----
          # RAX3000Q = IPQ5018(2.4G) + QCN6102(5G)，**不是** QCN6122
          WIFI_EXTRA=""
          fw_has()  { grep -rqI "^define Package/$1\$" package/firmware/ath11k-firmware/ 2>/dev/null; }
          bdf_has() { ls package/firmware/ipq-wifi/board-"$1".ipq* >/dev/null 2>&1; }
          for p in ath11k-firmware-ipq5018 ath11k-firmware-ipq5018-qcn6122; do
            if fw_has "$p"; then
              WIFI_EXTRA="$WIFI_EXTRA CONFIG_PACKAGE_$p=y"
            fi
          done
          # 板级 BDF 是按「文件名」列的（board-<板名>.ipq<芯片>），不能用内容 grep 判断
          if bdf_has cmcc_rax3000q; then
            echo "上游已新增 ipq-wifi-cmcc_rax3000q 板级数据，直接用它"
            WIFI_EXTRA="$WIFI_EXTRA CONFIG_PACKAGE_ipq-wifi-cmcc_rax3000q=y"
          else
            echo "::warning::上游没有 ipq-wifi-cmcc_rax3000q 板级 BDF（已核实官方包索引里不存在），Wi-Fi 属实验性功能"
            for fb in cmcc_mr3000d-ci cmcc_rm2-6; do
              if bdf_has "$fb"; then
                echo "::warning::退用 ipq-wifi-$fb 作 BDF 兜底（不是 RAX3000Q 原厂 BDF，能否驱动射频必须上机实测）"
                WIFI_EXTRA="$WIFI_EXTRA CONFIG_PACKAGE_ipq-wifi-$fb=y"
              fi
            done
          fi
          if [ -n "$WIFI_EXTRA" ]; then
            echo "== 自动追加的无线固件包 =="
            for c in $WIFI_EXTRA; do echo "$c" >> .config; done
            echo "$WIFI_EXTRA" | tr ' ' '\n' | grep -v '^$' | tee "$GITHUB_WORKSPACE/wifi-packages.txt"
          fi

          make defconfig

          echo "== 最终设备选择 =="
          grep -E '^CONFIG_TARGET_(qualcommax|.*DEVICE.*)=y' .config | tee config-targets.txt
          if ! grep -q "^CONFIG_TARGET_${DEVICE_SYM}=y" .config; then
            echo "::error:: 设备符号 CONFIG_TARGET_${DEVICE_SYM} 没有生效（官方可能改了设备名）"
            exit 1
          fi
          echo "== 检查固件体积上限（官方 limits.image = 60817408）=="
          grep -E 'FILE_SIZE|LIMIT' .config || true

          # 报告「请求了但没选上」的包（包名写错 / 该 feed 里不存在）——不中断编译，只告警
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_SEED" ]; then
            MISSING=""
            for pkg in $(grep -oE '^CONFIG_PACKAGE_[^=]+=y' "$GITHUB_WORKSPACE/$CONFIG_SEED" \
                         | sed 's/^CONFIG_PACKAGE_//; s/=y$//'); do
              grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || MISSING="$MISSING $pkg"
            done
            if [ -n "$MISSING" ]; then
              echo "::warning::以下包名未被接受（可能名字不对或该 feed 里不存在）:$MISSING"
              printf 'MISSING PACKAGES:%s\n' "$MISSING" | tee missing-packages.txt
            else
              echo "::notice::所有请求的包都已成功选上"
            fi
          fi

      - name: 叠加自定义 files/（公共 + 轨道A 专属）
        run: |
          set -e
          mkdir -p /workdir/openwrt/files
          cp -a "$GITHUB_WORKSPACE/common/files/." /workdir/openwrt/files/ 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/official/files/." /workdir/openwrt/files/ 2>/dev/null || true
          find /workdir/openwrt/files -type f -name '*.sh' -exec chmod +x {} \; || true
          chmod +x /workdir/openwrt/files/usr/sbin/* 2>/dev/null || true
          # /etc/uci-defaults/* 没有 .sh 后缀，但必须可执行，否则首次启动不会执行
          chmod +x /workdir/openwrt/files/etc/uci-defaults/* 2>/dev/null || true
          echo "== uci-defaults 权限 =="
          ls -l /workdir/openwrt/files/etc/uci-defaults/ 2>/dev/null || true
          echo "== files/ overlay =="
          find /workdir/openwrt/files -type f | sort

      - name: 记录官方 snapshot 的参照信息（内核实录值）
        run: |
          set -x
          curl -fsSL "https://downloads.openwrt.org/snapshots/targets/${TARGET_PATH}/profiles.json" \
            -o "$GITHUB_WORKSPACE/official-profiles.json" || echo "::warning::取不到官方 profiles.json"
          if [ -s "$GITHUB_WORKSPACE/official-profiles.json" ]; then
            python3 - <<'PY' | tee "$GITHUB_WORKSPACE/official-reference.txt"
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          d = json.load(open(os.path.join(ws, "official-profiles.json")))
          print("官方 buildbot git_commit :", d.get("git_commit"))
          print("官方 version_code        :", d.get("version_code"))
          print("官方 kernel version      :", d.get("linux_kernel", {}).get("version"))
          print("官方 kernel vermagic     :", d.get("linux_kernel", {}).get("vermagic"))
          print("官方 arch_packages       :", d.get("arch_packages"))
          p = d.get("profiles", {}).get("cmcc_rax3000q", {})
          print("官方 device_packages     :", p.get("device_packages"))
          print("官方 default_packages    :", d.get("default_packages"))
          PY
          fi

      - name: 下载依赖
        working-directory: /workdir/openwrt
        run: |
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: SSH 调试（仅当手动勾选）
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: owenthereal/action-upterm@v1

      - name: 编译
        id: compile
        working-directory: /workdir/openwrt
        run: |
          echo "$(nproc) 线程编译"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 校验内核 vermagic 是否与官方一致
        if: steps.compile.outputs.status == 'success'
        working-directory: /workdir/openwrt
        run: |
          set -x
          VM_FILE=$(find build_dir -name .vermagic 2>/dev/null | head -n1)
          echo "vermagic 文件: $VM_FILE"
          LOCAL_VM=$(cat "$VM_FILE" 2>/dev/null | tr -d '\n')
          echo "本地 vermagic = [$LOCAL_VM]"
          OFF_VM=$(python3 -c "
import json,os
p=os.environ.get('GITHUB_WORKSPACE','')+'/official-profiles.json'
try: print(json.load(open(p))['linux_kernel']['vermagic'])
except Exception: print('')
")
          echo "官方 vermagic = [$OFF_VM]"
          {
            echo "本地 vermagic: $LOCAL_VM"
            echo "官方 vermagic: $OFF_VM"
          } >> "$GITHUB_WORKSPACE/vermagic-compare.txt"
          if [ -n "$OFF_VM" ] && [ "$LOCAL_VM" != "$OFF_VM" ]; then
            echo "::notice::本地产物 vermagic ($LOCAL_VM) 与官方 snapshot ($OFF_VM) 不同。"
            echo "这**只影响官方源里的 kmod-***（内核模块装不上），**用户态包照样能 apk add**（LuCI、opennds、工具等）。"
            echo "若用的是 main HEAD（默认），内核比官方 snapshot 新，vermagic 必然不同 —— 属预期。"
            echo "要让官方 kmod 也能装，请把 workflow_dispatch 的 ref 设为官方快照提交 ae9276426c2e51ebba1732f952b0592ca8af24b6。"
            {
              echo "vermagic 不一致（预期内）：本地 $LOCAL_VM / 官方 $OFF_VM"
              echo "影响范围：仅官方源 kmod-*；用户态包不受影响。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::vermagic 与官方一致，官方 kmod 也可以直接 apk add"
          fi

      - name: 收集产物
        if: steps.compile.outputs.status == 'success'
        run: |
          set -x
          ls -lh /workdir/openwrt/bin/targets/${TARGET_PATH}/
          mkdir -p out
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/*.bin out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/*.ubi out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/*.itb out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/profiles.json out/ 2>/dev/null || true
          cp -a /workdir/openwrt/.config out/config.final.txt || true
          cp -a "$GITHUB_WORKSPACE/official-reference.txt" out/ 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/vermagic-compare.txt" out/ 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/openwrt-head.txt" out/ 2>/dev/null || true
          ls -lh out/
          # 校验体积上限
          LIMIT=60817408
          for f in out/*.ubi out/*.bin; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt "$LIMIT" ]; then
              echo "::error::$f 体积 $sz 超过官方上限 $LIMIT"
            fi
          done

      - name: 上传编译产物
        uses: actions/upload-artifact@main
        with:
          name: openwrt-official-ipq50xx-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: 失败时也保存 .config 便于排查
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: official-debug-${{ github.run_number }}
          path: |
            /workdir/openwrt/.config
            /workdir/openwrt/config-targets.txt
          if-no-files-found: ignore

      - name: 发 Release
        if: steps.compile.outputs.status == 'success' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: official-ipq50xx-${{ github.run_number }}
          name: 轨道A OpenWrt 官方 main #${{ github.run_number }}
          body: |
            OpenWrt official main (qualcommax/ipq50xx) for CMCC RAX3000Q / RAX3000QY
            - 内核与官方 snapshot 同源、vermagic 一致 → 官方 apk 源里的 kmod-* 可直接安装
            - 已预置：LuCI 全中文、IPv6、OpenNDS portal 网页认证、MAC 修改工具
            - 刷机说明见仓库 docs/刷机教程.md
          files: out/*
          fail_on_unmatched_files: false
